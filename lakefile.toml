name = "Phylogenetics"
version = "0.3.0"
keywords = ["math", "phylogenetics"]
description = "Phylogenetic trees and networks, directed multigraphs and blobs, the coalescent and the (network) multispecies coalescent, quartet concordance factors and hypothesis tests"
defaultTargets = ["Phylogenetics"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.36.0-rc1"

[[lean_lib]]
name = "Phylogenetics"
globs = ["Phylogenetics.*"]
