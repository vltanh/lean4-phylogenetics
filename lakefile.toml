name = "Phylogenetics"
version = "0.2.0"
keywords = ["math", "phylogenetics"]
description = "Phylogenetic trees and networks, the coalescent and the (network) multispecies coalescent, quartet concordance factors, gene trees"
defaultTargets = ["Phylogenetics"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0-rc4"

[[lean_lib]]
name = "Phylogenetics"
globs = ["Phylogenetics.*"]
