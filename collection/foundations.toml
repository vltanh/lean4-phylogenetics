# The shared mathematics that the papers of the hubs need, and where it is or will be.
#
# A foundation is a definition or standard theory that several papers use. Its home is the lowest
# node of the tree above every repository that uses it (docs/CONVENTIONS.md, Section 4): a hub's
# library when only the papers of that hub and of its sub-hubs need it, this repository's library
# otherwise. A foundation that a paper builds first moves to its home when a second paper needs it.
#
# status: "available" (in its home, on the train), "partial" (part of it exists; `where` says what),
#         "missing"
# needed_by: the hubs and families (of the hub's catalog) that need it

[[foundation]]
id = "rooted-networks"
name = "Rooted phylogenetic networks: directed multigraphs, cuts and cut edges, blobs, induced networks, the tree of blobs, the level of a blob"
status = "available"
home = "lean4-phylogenetics"
where = "Phylogenetics/Graph/, Phylogenetics/Network/"
needed_by = ["lean4-phylo-network: 1-5", "lean4-phylo-combinatorics: 5, 6", "lean4-phylo-geometry: 7"]

