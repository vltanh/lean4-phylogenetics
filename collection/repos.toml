# The registry of the collection: the repositories, as a tree, and the versions they all share.
#
# The root, lean4-phylogenetics, holds the library that every repository shares. Each hub holds the
# library of what its papers share, and the catalog of its papers (catalog/papers.toml in the hub).
# A hub's parent is the root or the hub above it, of which it is a sub-hub; a repository requires the
# libraries of the root and of every hub above it. A library is a repository under a hub with a
# library and no catalog: what some papers of that hub share and the rest do not; those papers name
# it in `uses`, and require it.
# A paper's repository is listed in its hub's catalog; it is listed here too only when it needs a
# note (it is off the train, or has generic module roots). A definition or result goes to the lowest
# node above every repository that uses it (docs/CONVENTIONS.md, Section 4).
#
# scripts/status.py renders the README's tables from this file and compares it with the
# repositories on disk; scripts/new_paper.py reads [train].

# The release that every repository is on, and the commit of each library of the tree that the
# repositories below it require. Move the train deliberately, root first (docs/WORKFLOW.md, Section 7).
[train]
lean = "leanprover/lean4:v4.37.0-rc1"
mathlib = "v4.37.0-rc1"

[train.pins]
Phylogenetics = "3fcabfd7d191990dda268b0b3968d945b65eb59a"     # lean4-phylogenetics 0.6.1
PhyloAlignment = "26847fddc7893195381672c74c14299035d72435"    # lean4-phylo-alignment 0.1.0
PhyloGeneTree = "761f89ff51d52a39c9947f190eb5cd3cb2215707"     # lean4-phylo-gene-tree 0.1.0
PhyloSpeciesTree = "c32a1e4224166fe645dc0f034291169ad5df224b"  # lean4-phylo-species-tree 0.1.0
PhyloNetwork = "4ed2bb0f7085acbf1326f43e2a5c582ba4566125"      # lean4-phylo-network 0.2.0
TreeOfBlobs = "265ba443cb147a33ff2478cbc311a5597db1c1c7"       # lean4-phylo-tree-of-blobs 0.3.1
PhyloCombinatorics = "8a4fe61016489eaa2892826a2309d619df73d342" # lean4-phylo-combinatorics 0.1.0
PhyloAlgebraic = "c730cde00d9ab76e54a641c20e53ec7bdb417a0b"    # lean4-phylo-algebraic 0.1.0
PhyloStatistics = "d54794c6e5ce99fe96da232ec169dcaa2a5e34dd"   # lean4-phylo-statistics 0.1.0
PhyloGeometry = "af37fc2c7f94f62f85788f981601424833a47485"     # lean4-phylo-geometry 0.1.0
PhyloPlacement = "6728e38402c2051fd59b8d3f3f20ad9739a6c2d5"    # lean4-phylo-placement 0.1.0

# role: root | hub | library (under a hub, with no catalog) | paper | background (a formalized paper
#   outside every catalog) | tool
# parent: the hub or root above it (a hub under a hub is a sub-hub); a library's is a hub
# kind: for a hub under the root, "inference" (the papers on estimating one object, with the theory
#   of each estimator) or "theory" (the papers of one kind of general result); docs/CONVENTIONS.md,
#   Section 1. A sub-hub, or a library, is of its hub's kind
# require: whether new repositories may require it: "always", "when-needed", or "no" (see `note`)

[[repo]]
name = "lean4-phylogenetics"
role = "root"
package = "Phylogenetics"
url = "https://github.com/formal-phylogenetics/lean4-phylogenetics"
lean = "v4.37.0-rc1"
require = "always"
title = "Phylogenetics"
summary = "General phylogenetics, which every repository shares: rooted networks (cuts, blobs, induced networks, the tree of blobs, level-1 networks) and semidirected networks, trees and quartets, neighbor joining and ASTRAL's dynamic program, Kingman's coalescent, the multispecies coalescent and the network multispecies coalescent with quartet concordance factors and generic parameters"

[[repo]]
name = "lean4-phylo-alignment"
role = "hub"
parent = "lean4-phylogenetics"
kind = "inference"
package = "PhyloAlignment"
url = "https://github.com/formal-phylogenetics/lean4-phylo-alignment"
lean = "v4.37.0-rc1"
require = "always"
title = "Sequence alignment"
summary = "What the papers on sequence alignment share and the root library does not hold: nothing yet. Its catalog has the papers on divide-and-conquer alignment and the co-estimation of alignments and trees, profile hidden Markov models and fragmentary sequences, statistical alignment under indel models, phylogeny-aware, progressive, consistency-based and graph-based alignment, pairwise alignment by dynamic programming, the complexity of multiple alignment, alignment uncertainty and its effect on tree estimation, the alignment of RNA, coding sequences and structures, and learned alignment models"

[[repo]]
name = "lean4-phylo-gene-tree"
role = "hub"
parent = "lean4-phylogenetics"
kind = "inference"
package = "PhyloGeneTree"
url = "https://github.com/formal-phylogenetics/lean4-phylo-gene-tree"
lean = "v4.37.0-rc1"
require = "always"
title = "Gene tree estimation"
summary = "What the papers on estimating a tree from sequences share and the root library does not hold: nothing yet. Its catalog has the papers on maximum likelihood and tree search, distance methods and minimum evolution, substitution models and their selection, parsimony, Bayesian inference and MCMC, branch support, rooting and tests, divide-and-conquer reconstruction, the reconstruction of ancestral states and sequences, and alignment-free inference"

[[repo]]
name = "lean4-phylo-species-tree"
role = "hub"
parent = "lean4-phylogenetics"
kind = "inference"
package = "PhyloSpeciesTree"
url = "https://github.com/formal-phylogenetics/lean4-phylo-species-tree"
lean = "v4.37.0-rc1"
require = "always"
title = "Species tree estimation"
summary = "What the papers on estimating species trees share and the root library does not hold: nothing yet. Its catalog has the papers on species trees from gene trees (quartets, rooted triplets and clades, distances), from sequences directly, by full likelihood and Bayesian inference, and under duplication, loss and transfer; on rooting, branch lengths and tests, on the coalescent and the limits of particular estimators, on divide-and-conquer pipelines, and on supertrees and the merging of trees"

[[repo]]
name = "lean4-phylo-network"
role = "hub"
parent = "lean4-phylogenetics"
kind = "inference"
package = "PhyloNetwork"
url = "https://github.com/formal-phylogenetics/lean4-phylo-network"
lean = "v4.37.0-rc1"
require = "always"
title = "Phylogenetic network estimation"
summary = "What the papers on estimating networks share, those on the tree of blobs included: hypothesis tests on quartet concordance factors (Mitchell et al. 2019), blobs, blocks and wedge paths of level-1 networks with the strict dominance of an induced cut-edge split, cut splits of induced networks, the chain of the network multispecies coalescent on a concrete network, and the sources several papers cite (Rhodes 2020, Huber et al. 2025). Its catalog has the papers on quartet- and quintet-based inference, semi-directed and rooted reconstruction, multiple trees, sequence data, and the tree of blobs"

[[repo]]
name = "lean4-phylo-tree-of-blobs"
role = "library"
parent = "lean4-phylo-network"
package = "TreeOfBlobs"
url = "https://github.com/formal-phylogenetics/lean4-phylo-tree-of-blobs"
lean = "v4.37.0-rc1"
require = "when-needed"
title = "The tree of blobs"
summary = "What only the papers of lean4-phylo-network on inferring the tree of blobs share: the algorithms and standing assumptions of TINNiK, TOB-QMC and ECToBlob, networks given by tables, lowest common ancestors, the local objective of a multifurcation, counts of tree edges, and the analysis that only they use"

[[repo]]
name = "lean4-phylo-placement"
role = "hub"
parent = "lean4-phylogenetics"
kind = "inference"
package = "PhyloPlacement"
url = "https://github.com/formal-phylogenetics/lean4-phylo-placement"
lean = "v4.37.0-rc1"
require = "always"
title = "Phylogenetic placement"
summary = "What the papers on phylogenetic placement share and the root library does not hold: nothing yet. Its catalog has the papers on placing sequences on a reference tree by likelihood, distances, quartets and learned embeddings, alignment-free and genome-wide placement from k-mers, the incremental reconstruction of trees at pandemic scale, and phylogenetic metagenomics: taxonomic assignment and profiling, phylogenetic diversity, distances between communities, and phylogenetically structured statistics"

[[repo]]
name = "lean4-phylo-combinatorics"
role = "hub"
parent = "lean4-phylogenetics"
kind = "theory"
package = "PhyloCombinatorics"
url = "https://github.com/formal-phylogenetics/lean4-phylo-combinatorics"
lean = "v4.37.0-rc1"
require = "always"
title = "The combinatorics of phylogenetic trees and networks"
summary = "What the papers on the combinatorics of trees share and the root library does not hold: nothing yet. Its catalog has the papers on the characterization, comparison and reconstruction of trees, perfect phylogeny and the compatibility of characters, the decomposition of networks with recombination, the amalgamation of quartets, the shape and balance of trees, induced subtrees and decks, the structure and enumeration of networks, and phylogenetic diversity, with the computational complexity of these problems"

[[repo]]
name = "lean4-phylo-algebraic"
role = "hub"
parent = "lean4-phylogenetics"
kind = "theory"
package = "PhyloAlgebraic"
url = "https://github.com/formal-phylogenetics/lean4-phylo-algebraic"
lean = "v4.37.0-rc1"
require = "always"
title = "Algebraic phylogenetics"
summary = "What the papers on algebraic phylogenetics share and the root library does not hold: nothing yet. Its catalog has the papers on phylogenetic invariants and Fourier methods, the identifiability of trees and parameters, mixture models and their nonidentifiability, and spectral and algebraic reconstruction"

[[repo]]
name = "lean4-phylo-statistics"
role = "hub"
parent = "lean4-phylogenetics"
kind = "theory"
package = "PhyloStatistics"
url = "https://github.com/formal-phylogenetics/lean4-phylo-statistics"
lean = "v4.37.0-rc1"
require = "always"
title = "The statistical theory of phylogenetic inference"
summary = "What the papers on the statistical theory of phylogenetic inference share and the root library does not hold: nothing yet. Its catalog has the papers on fast convergence and sample complexity, consistency and model misspecification, gene-tree discordance and the limits of species-tree inference, the identifiability and consistency of indel models, tests near singularities and boundaries, and random phylogenies"

[[repo]]
name = "lean4-phylo-geometry"
role = "hub"
parent = "lean4-phylogenetics"
kind = "theory"
package = "PhyloGeometry"
url = "https://github.com/formal-phylogenetics/lean4-phylo-geometry"
lean = "v4.37.0-rc1"
require = "always"
title = "Phylogenetic geometry"
summary = "What the papers on the geometry of spaces of phylogenetic trees share and the root library does not hold: nothing yet. Its catalog has the papers on the metric geometry of tree spaces and their geodesics, statistics and optimization in tree spaces, principal components, tropical geometry, information geometry, ranked trees and trees on different leaf sets, and the discrete metrics of tree moves and spaces of networks"

[[repo]]
name = "lean4-camus"
role = "paper"
parent = "lean4-phylo-network"
package = "Camus"
root = "Camus"
url = "https://github.com/formal-phylogenetics/lean4-camus"
lean = "v4.37.0-rc1"
require = "when-needed"
commit = "2cc92c267854263ffa3a071dbc91a109ed0d40b3"
summary = "Willson, Warnow 2026 (CAMUS), with Observation 2 and the site model of Warnow, Tabatabaee, Evans 2025"
note = "Requires lean4-phylogenetics and lean4-phylo-network at the train's pins, and lean4-allman2011 at d4ada2c for the distributions of the gene trees on four taxa; has the layout of a paper's repository (root and paper Camus)"

[[repo]]
name = "lean4-allman2011"
role = "paper"
parent = "lean4-phylo-statistics"
package = "Allman2011"
root = "Allman2011"
url = "https://github.com/formal-phylogenetics/lean4-allman2011"
lean = "v4.37.0-rc1"
require = "when-needed"
commit = "d4ada2c6cbbb5b8629eb9740dc5d5a9984a06a78"
summary = "Allman, Degnan, Rhodes 2011: the rooted species tree from unrooted gene trees under the coalescent, stated on the species trees of lean4-phylogenetics"
note = "Requires lean4-phylogenetics at the train's pin, which holds its general parts, and not PhyloStatistics, the library of its hub, which it predates; has the layout of a paper's repository (root and paper Allman2011)"

[[repo]]
name = "lean4-gusfield2007"
role = "paper"
parent = "lean4-phylo-combinatorics"
package = "Gusfield2007"
root = "Gusfield2007"
url = "https://github.com/formal-phylogenetics/lean4-gusfield2007"
lean = "v4.37.0-rc1"
require = "when-needed"
commit = "bd3940001c6f030816f13191b348596763b1f146"
summary = "Gusfield, Bansal, Bafna, Song 2007: the decomposition theory of networks with recombination"
note = "Requires lean4-phylogenetics at the train's pin, and not PhyloCombinatorics, the library of its hub, which it predates; has the layout of a paper's repository (root and paper Gusfield2007)"

[[repo]]
name = "formalize-math-paper"
role = "tool"
url = "https://github.com/vltanh/formalize-math-paper"
require = "no"
summary = "The procedure that formalizes each paper"
